[project]
name = "pokesketch"
version = "0.1.0"
description = "Self-hosted Discord bot that posts a daily Pokemon sketch challenge and gamifies contributions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel Elston" }]
dependencies = [
    "discord.py>=2.4,<3.0",
    "SQLAlchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20",
    "APScheduler>=3.10,<4.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
pokesketch = "pokesketch.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
